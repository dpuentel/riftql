name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Release Gate Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Vitest suite
        run: pnpm test

  prepare-release:
    name: Prepare GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - name: Create or reuse Draft Release
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$TAG_NAME" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          RELEASE_ID="$(gh api --paginate "repos/${REPO}/releases?per_page=100" \
            | jq -rs --arg tag "$TAG_NAME" '[.[][] | select(.tag_name == $tag) | .id] | first // empty')"

          if [[ -z "$RELEASE_ID" ]]; then
            RELEASE_ID="$(gh api -X POST "repos/${REPO}/releases" \
              -f tag_name="$TAG_NAME" \
              -f name="RiftQL ${TAG_NAME}" \
              -f body="See the assets below to download and install RiftQL for Windows, Linux, or macOS." \
              -F draft=true \
              -F prerelease="$IS_PRERELEASE" \
              -F generate_release_notes=true \
              --jq '.id')"
          fi

          if [[ -z "$RELEASE_ID" ]]; then
            echo "Failed to resolve GitHub release ID for ${TAG_NAME}" >&2
            exit 1
          fi

          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.artifact_name }})
    needs: [test, prepare-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact_name: linux-x64
            rust_target: ''
            args: ''
          - platform: windows-latest
            artifact_name: windows-x64
            rust_target: ''
            args: ''
          - platform: macos-latest
            artifact_name: macos-arm64
            rust_target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            artifact_name: macos-x64
            rust_target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure updater build arguments
        if: startsWith(github.ref, 'refs/tags/v')
        id: build-args
        shell: bash
        env:
          BASE_ARGS: ${{ matrix.args }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          ARGS="$BASE_ARGS"
          if [[ "$HAS_SIGNING_KEY" == "true" ]]; then
            printf '{"bundle":{"createUpdaterArtifacts":true}}\n' > src-tauri/tauri.updater.conf.json
            ARGS="${ARGS:+$ARGS }--config src-tauri/tauri.updater.conf.json"
          fi
          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"

      - name: Build and attach binaries to GitHub Draft Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          uploadUpdaterJson: false
          args: ${{ steps.build-args.outputs.args }}

      - name: Build Tauri bundle (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm tauri build ${{ matrix.args }}

      - name: Upload built installers as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: riftql-${{ matrix.artifact_name }}
          path: src-tauri/target/**/release/bundle/**/*
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    needs: [prepare-release, build]
    if: startsWith(github.ref, 'refs/tags/v') && needs.prepare-release.outputs.release_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Generate consolidated latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/generate-latest-json.mjs --out latest.json

      - name: Upload consolidated latest.json to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail
          if [[ -f latest.json ]]; then
            EXISTING_ASSET_ID="$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets" \
              --jq '.[] | select(.name == "latest.json") | .id' | head -n 1 || true)"
            if [[ -n "$EXISTING_ASSET_ID" ]]; then
              gh api -X DELETE "repos/${REPO}/releases/assets/${EXISTING_ASSET_ID}"
            fi
            gh api -X POST "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=latest.json" \
              -H "Content-Type: application/json" \
              --data-binary @latest.json
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          IS_PRERELEASE: ${{ needs.prepare-release.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            MAKE_LATEST="false"
          else
            MAKE_LATEST="true"
          fi
          gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease="$IS_PRERELEASE" \
            -f make_latest="$MAKE_LATEST"
