[package]
name = "riftql"
version = "0.5.3"
description = "RiftQL - The local-first API client for REST & GraphQL"
authors = ["David Puente"]
edition = "2021"

[lib]
name = "riftql_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "multipart", "stream", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
thiserror = "2"
cookie = "0.18"
tokio-util = { version = "0.7", features = ["io"] }
mime_guess = "2"

[dev-dependencies]
tempfile = "3"
axum = { version = "0.8", features = ["multipart"] }
